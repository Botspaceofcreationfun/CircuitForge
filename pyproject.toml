[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitforge"
version = "1.0.0"
description = "A small circuit simulator built from first principles on modified nodal analysis (MNA)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
circuitforge = "circuitforge.cli:main"

[tool.setuptools]
packages = ["circuitforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
